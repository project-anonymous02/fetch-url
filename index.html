<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #0f1419;
            border-bottom: 2px solid #00ff88;
            padding: 12px;
            text-align: center;
        }

        .header h1 {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
        }

        textarea {
            flex: 0 0 auto;
            height: 100px;
            background: #1a2332;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: none;
        }

        textarea::placeholder {
            color: #00ff8844;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        select {
            flex: 1;
            min-width: 100px;
            background: #1a2332;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
        }

        button {
            background: #00ff88;
            border: none;
            color: #0a0e27;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-radius: 3px;
            flex: 1;
            min-width: 80px;
        }

        button:active {
            transform: scale(0.95);
        }

        button.danger {
            background: #ff3333;
            color: white;
        }

        #terminal {
            flex: 1;
            background: #0a0e27;
            border: 1px solid #00ff8844;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-line {
            margin-bottom: 2px;
        }

        .success {
            color: #00ff88;
        }

        .error {
            color: #ff3333;
        }

        .info {
            color: #88ccff;
        }

        .loading {
            color: #ffaa33;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 NOVA TERMINAL</h1>
    </div>

    <div class="container">
        <textarea id="input" placeholder="Ketik command..." spellcheck="false"></textarea>

        <div class="controls">
            <select id="mode">
                <option value="python">🐍 Python</option>
                <option value="shell">🔧 Shell</option>
                <option value="fetch">🌐 Fetch</option>
                <option value="context">📦 Context</option>
                <option value="search">🔍 Search</option>
            </select>
            <button id="execute">▶ RUN</button>
            <button id="clear" class="danger">✕ CLEAR</button>
        </div>

        <div id="terminal"></div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('input');
        const modeSelect = document.getElementById('mode');
        const executeBtn = document.getElementById('execute');
        const clearBtn = document.getElementById('clear');
        const BASE_URL = 'https://downloder-amber.vercel.app';

        let isExecuting = false;

        function print(text, type = 'info') {
            const line = document.createElement('div');
            line.className = `output-line ${type}`;
            line.textContent = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        executeBtn.addEventListener('click', async () => {
            if (isExecuting) return;

            const code = input.value.trim();
            if (!code) {
                print('Error: Input kosong!', 'error');
                return;
            }

            const mode = modeSelect.value;
            isExecuting = true;
            executeBtn.disabled = true;

            print(`> ${mode}: ${code.substring(0, 50)}${code.length > 50 ? '...' : ''}`, 'info');
            print('...', 'loading');

            try {
                let url;

                if (mode === 'python') {
                    url = `${BASE_URL}/api?code=${encodeURIComponent(code)}&timeout=25`;
                } else if (mode === 'shell') {
                    url = `${BASE_URL}/api?code=${encodeURIComponent('!' + code)}&timeout=25`;
                } else if (mode === 'fetch') {
                    url = `${BASE_URL}/api/fetch?url=${encodeURIComponent(code)}&parse=auto`;
                } else if (mode === 'context') {
                    url = `${BASE_URL}/api/context`;
                } else if (mode === 'search') {
                    url = `${BASE_URL}/api/search?summary=${encodeURIComponent(code)}`;
                }

                terminal.removeChild(terminal.lastChild);

                const response = await fetch(url);
                const data = await response.json();

                if (response.ok) {
                    print('✓ OK', 'success');
                    
                    if (data.output) {
                        print(data.output, 'success');
                    }
                    if (data.message) {
                        print(data.message, 'success');
                    }
                    if (data.context) {
                        print(JSON.stringify(data.context, null, 2), 'success');
                    }
                    if (data.search_data) {
                        data.search_data.forEach(item => {
                            print(`• ${item.title}`, 'success');
                            print(`  ${item.summary.substring(0, 100)}...`, 'info');
                        });
                    }
                    if (!data.output && !data.message && !data.context && !data.search_data) {
                        print(JSON.stringify(data, null, 2), 'success');
                    }
                } else {
                    print('✗ Error', 'error');
                    print(JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                terminal.removeChild(terminal.lastChild);
                print(`✗ ${error.message}`, 'error');
            } finally {
                isExecuting = false;
                executeBtn.disabled = false;
            }
        });

        clearBtn.addEventListener('click', () => {
            terminal.innerHTML = '';
            input.value = '';
        });

        print('Nova Terminal Ready', 'success');
    </script>
</body>
</html>
